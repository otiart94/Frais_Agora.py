name: Sauvegarde Supabase

on:
  schedule:
    - cron: "0 5 * * *"     # chaque jour : empêche la mise en pause du projet
    - cron: "30 5 * * 1"    # chaque lundi : sauvegarde complète
  workflow_dispatch:         # lancement manuel depuis l'onglet Actions
    inputs:
      mode:
        description: "ping = test de connexion, backup = sauvegarde complète"
        type: choice
        options:
          - backup
          - ping
        default: backup

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le client Supabase
        run: pip install supabase

      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 5 * * 1" ]; then
            echo "mode=backup" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ping" >> "$GITHUB_OUTPUT"
          fi

      - name: Exécuter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sauvegarde.py ${{ steps.mode.outputs.mode }}

      - name: Conserver la sauvegarde (60 jours)
        if: ${{ always() && steps.mode.outputs.mode == 'backup' }}
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-frais-agora
          path: sauvegardes/*.zip
          retention-days: 60
          if-no-files-found: ignore
